<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>

  <style>
    /* ===========================================================================
       Portrait-canvas-in-landscape-page layout for CrazyGames.

       Strategy:
       - The OUTER page is landscape (fills CrazyGames' landscape iframe).
       - The INNER Unity canvas is locked to 9:16 portrait, centered, with
         decorative gutters on the left and right.

       This lets a portrait-designed game ship to a portal that only accepts
       landscape submissions, without any in-Unity UI redesign. The visual
       trade-off is wasted horizontal space; you can fill it with branding via
       the .side-panel elements below if you want.
       =========================================================================== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
      color: #ddd;
    }

    #unity-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Solid black background; replace with a gradient/image to brand the
         letterbox area. Example:
            background: url('TemplateData/side-banner.jpg') center/cover no-repeat;
      */
      background: #0a0a0f;
    }

    /* Lock the canvas to 9:16 portrait. Height fills the page; width is
       computed from the height by the browser via aspect-ratio. If the page
       ever becomes narrower than 9:16 (very tall iframe — uncommon on
       CrazyGames), width fills instead. */
    #unity-canvas {
      background: #231F20;
      display: block;
      aspect-ratio: 9 / 16;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
    }
    @media (max-aspect-ratio: 9 / 16) {
      /* Page taller than 9:16: pin to width instead of height to avoid clipping. */
      #unity-canvas { width: 100vw; height: auto; }
    }

    /* Decorative side panels. They sit behind the canvas in the flex
       container and only become visible in the area outside the 9:16 canvas.
       Add a logo or background art by editing the inner contents. */
    .side-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%; /* approximately the visible width of one letterbox bar at 16:9 */
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0.85;
    }
    .side-panel.left  { left: 0; }
    .side-panel.right { right: 0; }
    .side-panel h1 {
      font-size: 28px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ddd;
      opacity: 0.35;
      margin: 0;
      text-align: center;
    }

    /* Tiny loading text shown until createUnityInstance kicks in. */
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: 14px;
      letter-spacing: 0.05em;
      opacity: 0.6;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Replace the <h1> contents (or remove the .side-panel divs entirely) to
       brand the letterbox area however you want. -->
  <div class="side-panel left"><h1>{{{ PRODUCT_NAME }}}</h1></div>
  <div class="side-panel right"><h1>{{{ PRODUCT_NAME }}}</h1></div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="unity-loading-bar">Loading {{{ PRODUCT_NAME }}}...</div>

  <script>
    /* ===========================================================================
       CrazyGames key-capture fix — block scroll keys + WASD/ZQSD movement keys.
       =========================================================================== */
    (function () {
      var BLOCKED = [
        "Space",
        "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
        "KeyW", "KeyA", "KeyS", "KeyD",
        "KeyZ", "KeyQ"
      ];
      function shouldBlock(e) {
        var tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable)) return false;
        return BLOCKED.indexOf(e.code) !== -1;
      }
      window.addEventListener("keydown", function (e) { if (shouldBlock(e)) e.preventDefault(); },
                             { capture: true, passive: false });
      window.addEventListener("keyup",   function (e) { if (shouldBlock(e)) e.preventDefault(); },
                             { capture: true, passive: false });
    })();
  </script>

  <script>
    /* ===========================================================================
       Unity WebGL boot
       =========================================================================== */
    var canvas        = document.querySelector("#unity-canvas");
    var loadingBar    = document.querySelector("#unity-loading-bar");
    var buildUrl      = "Build";
    var loaderUrl     = buildUrl + "/{{{ LOADER_FILENAME }}}";

    var config = {
      dataUrl:            buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl:       buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:            buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName:        "{{{ COMPANY_NAME }}}",
      productName:        "{{{ PRODUCT_NAME }}}",
      productVersion:     "{{{ PRODUCT_VERSION }}}",
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        loadingBar.textContent = "Loading... " + Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
